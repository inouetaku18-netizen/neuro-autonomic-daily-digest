name: Daily Peer-Reviewed Paper Fetch & Translate

on:
  schedule:
    # 毎日 JST 07:00（UTC 22:00）に自動実行
    - cron: '5 22 * * *'
  workflow_dispatch:
    # GitHubの画面から「Run workflow」ボタンでいつでも手動テスト実行可能

permissions:
  contents: write

jobs:
  update-papers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch PubMed paper and generate structured JSON
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
        run: |
          python scripts/fetch_and_generate.py

      - name: Commit and push updated JSON data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --staged --quiet || git commit -m "chore: add daily translated paper ($(date -u +'%Y-%m-%d'))"
          git push
